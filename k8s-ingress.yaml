apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: estate-manager-ingress
  namespace: default
  annotations:
    # Alibaba Cloud Ingress NGINX annotations
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # SSL certificate from Alibaba Cloud SSL Service
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.estatemanager.com
        - app.estatemanager.com
      secretName: estate-manager-tls-secret
  rules:
    - host: api.estatemanager.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: estate-manager-service
                port:
                  number: 80
    - host: app.estatemanager.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: estate-manager-service
                port:
                  number: 80
