apiVersion: v1
kind: Secret
metadata:
  name: estate-manager-secret
  namespace: default
type: Opaque
stringData:
  # Database credentials (retrieve from Alibaba Cloud Secrets Manager)
  DB_USER: "estate_user"
  DB_PASSWORD: "your_secure_password_here"
  
  # JWT Secret for authentication
  JWT_SECRET: "your_jwt_secret_here"
  
  # Alibaba Cloud Access Credentials (use RAM Role instead in production)
  ALIBABA_CLOUD_ACCESS_KEY_ID: "your_access_key_id"
  ALIBABA_CLOUD_ACCESS_KEY_SECRET: "your_access_key_secret"
  
  # OSS Bucket configuration
  OSS_BUCKET: "estate-manager-assets"
  
  # Database URL (constructed from ConfigMap + Secret)
  DATABASE_URL: "mysql://estate_user:your_secure_password_here@rm-xxxxx.mysql.rds.aliyuncs.com:3306/estate_db"
