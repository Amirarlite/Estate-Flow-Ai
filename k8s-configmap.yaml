apiVersion: v1
kind: ConfigMap
metadata:
  name: estate-manager-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "8080"
  APP_NAME: "Estate Manager"
  LOG_LEVEL: "info"
  # Alibaba Cloud OSS Configuration
  OSS_REGION: "cn-hangzhou"
  OSS_ENDPOINT: "oss-cn-hangzhou.aliyuncs.com"
  # Database configuration (host should be internal RDS endpoint)
  DB_HOST: "rm-xxxxx.mysql.rds.aliyuncs.com"
  DB_PORT: "3306"
  DB_NAME: "estate_db"
